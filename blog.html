<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesisat Rehberi Blog - Fiber Tesisat</title>
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root { --primary-color: #0284c7; --font-family: 'sans-serif'; }
        body { font-family: var(--font-family); }
        .bg-primary { background-color: var(--primary-color); }
        .text-primary { color: var(--primary-color); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <a href="index.html" class="text-2xl font-black text-primary tracking-tight">FIBER TESİSAT</a>
            <div class="flex space-x-6 font-semibold text-sm">
                <a href="index.html" class="text-gray-600 hover:text-primary transition">Ana Sayfa</a>
                <a href="hakkimizda.html" class="text-gray-600 hover:text-primary transition">Hakkımızda</a>
                <a href="blog.html" class="text-primary border-b-2 border-primary pb-1">Blog</a>
                <a href="iletisim.html" class="text-gray-600 hover:text-primary transition">İletişim</a>
            </div>
            <div class="flex gap-4 text-xl" id="header-socials"></div>
        </div>
    </nav>

    <header class="bg-primary text-white py-16 text-center">
        <h1 class="text-4xl font-black mb-2 tracking-tight">Faydalı Makaleler & SEO Günlükleri</h1>
        <p class="text-white/80 max-w-md mx-auto text-sm">Toplamda 9 ana başlık altında toplanmış profesyonel makale rehberi.</p>
    </header>

    <!-- Tam İstediğiniz Yan Yana 3'lü, Alt Alta 9'lu Kutu Düzeni -->
    <main class="max-w-7xl mx-auto px-4 py-16 w-full flex-grow">
        <div id="blog-9-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- 9 Kutu JS ile kusursuz basılacak -->
        </div>
    </main>

    <footer class="bg-slate-950 text-gray-400 text-center py-8 text-xs border-t border-gray-900">
        &copy; 2026 Fiber Tesisat. Tüm Hakları Saklıdır.
    </footer>

    <script>
        const settings = JSON.parse(localStorage.getItem('fiberTesisatSettings')) || { blogs9: [] };
        
        // Eğer panelden 9 kutu hiç doldurulmadıysa, kırık durmasın diye 9 adet şablon otomatik üretilir
        const default9Blogs = [];
        for(let i=1; i<=9; i++) {
            default9Blogs.push({
                id: i,
                title: `Profesyonel Tesisat Makalesi #${i}`,
                summary: `Yönetim panelinden bu ${i}. kutunun başlığını, görselini ve detaylı SEO makale metnini anında güncelleyebilirsiniz.`,
                content: 'Detaylı içerik yazısı henüz girilmedi...',
                img: 'https://unsplash.com',
                date: '24.09.2026'
            });
        }

        const active9Blogs = (settings.blogs9 && settings.blogs9.length === 9) ? settings.blogs9 : default9Blogs;
        
        const grid = document.getElementById('blog-9-grid');
        active9Blogs.forEach(blog => {
            grid.innerHTML += `
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-lg transition flex flex-col h-full">
                    <img src="${blog.img}" class="h-48 w-full object-cover bg-gray-100" alt="${blog.title}">
                    <div class="p-6 flex-grow flex flex-col justify-between">
                        <div>
                            <span class="text-xs text-gray-400 font-bold block mb-1"><i class="fa-solid fa-calendar-days"></i> ${blog.date}</span>
                            <h3 class="font-extrabold text-lg text-gray-900 mb-2 line-clamp-2">${blog.title}</h3>
                            <p class="text-gray-600 text-xs leading-relaxed line-clamp-4 mb-4">${blog.summary}</p>
                        </div>
                        <a href="blog-detay.html?boxId=${blog.id}" class="text-xs font-bold text-primary inline-flex items-center gap-1 hover:underline">
                            Yazının Tamamını Oku &rarr;
                        </a>
                    </div>
                </div>
            `;
        });

        // Üst Sosyal Medya
        if(settings.socials) {
            document.getElementById('header-socials').innerHTML = `
                <a href="${settings.socials.instagram}" target="_blank" class="hover:text-pink-500 transition text-gray-500"><i class="fa-brands fa-instagram"></i></a>
                <a href="${settings.socials.youtube}" target="_blank" class="hover:text-red-600 transition text-gray-500"><i class="fa-brands fa-youtube"></i></a>
                <a href="${settings.socials.tiktok}" target="_blank" class="hover:text-black transition text-gray-500"><i class="fa-brands fa-tiktok"></i></a>
            `;
        }
    </script>
</body>
</html>
