<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Fiber Tesisat</title>
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>.site-logo { height: 56px !important; width: auto !important; object-fit: contain !important; }</style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen font-sans">

    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-4 bg-white">
            <a href="index.html" class="block"><img src="images/logo.png" alt="Logo" class="site-logo"></a>
            <div class="flex flex-wrap justify-center space-x-4 md:space-x-6 font-semibold text-sm md:text-base">
                <a href="index.html" class="text-gray-600 hover:text-sky-600 transition">Ana Sayfa</a>
                <a href="hakkimizda.html" class="text-gray-600 hover:text-sky-600 transition">Hakkımızda</a>
                <a href="blog.html" class="text-sky-600 border-b-2 border-sky-600 pb-1">Blog</a>
                <a href="iletisim.html" class="text-gray-600 hover:text-sky-600 transition">İletişim</a>
            </div>
            <div class="flex gap-4 text-xl" id="header-socials"></div>
        </div>
    </nav>

    <header class="bg-sky-600 text-white py-16 text-center"><h1 class="text-4xl font-black mb-2">Faydalı Makaleler & SEO Günlükleri</h1></header>

    <main class="max-w-7xl mx-auto px-4 py-16 w-full flex-grow"><div id="blog-9-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div></main>

    <footer class="bg-slate-950 text-gray-400 text-center py-8 text-xs">&copy; 2026 Fiber Tesisat. Tüm Hakları Saklıdır.</footer>

    <script>
        const settings = JSON.parse(localStorage.getItem('fiberTesisatSettings')) || { blogs9: [], socials:{instagram:'#', youtube:'#', tiktok:'#'} };
        const defaultBlogs = [];
        for(let i=1; i<=9; i++) {
            defaultBlogs.push({ id: i, title: `Profesyonel Tesisat Makalesi #${i}`, summary: `Yönetim panelinden bu ${i}. kutunun başlığını, görselini ve detaylı SEO makale metnini anında güncelleyebilirsiniz.`, img: 'https://unsplash.com', date: '24.09.2026' });
        }
        const activeBlogs = (settings.blogs9 && settings.blogs9.length === 9) ? settings.blogs9 : defaultBlogs;
        const grid = document.getElementById('blog-9-grid');
        activeBlogs.forEach(blog => {
            grid.innerHTML += `
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-lg transition flex flex-col h-full">
                    <img src="${blog.img}" class="h-48 w-full object-cover bg-gray-100" alt="${blog.title}">
                    <div class="p-6 flex-grow flex flex-col justify-between">
                        <div><span class="text-xs text-gray-400 font-bold block mb-1">${blog.date}</span><h3 class="font-extrabold text-lg text-gray-900 mb-2 line-clamp-2">${blog.title}</h3><p class="text-gray-600 text-xs leading-relaxed line-clamp-4 mb-4">${blog.summary}</p></div>
                        <a href="blog-detay.html?boxId=${blog.id}" class="text-xs font-bold text-sky-600 inline-flex items-center gap-1 hover:underline">Yazının Tamamını Oku &rarr;</a>
                    </div>
                </div>`;
        });
        document.getElementById('header-socials').innerHTML = `<a href="${settings.socials.instagram}" target="_blank" class="hover:text-pink-500 transition text-gray-500 mx-1"><i class="fa-brands fa-instagram"></i></a><a href="${settings.socials.youtube}" target="_blank" class="hover:text-red-600 transition text-gray-500 mx-1"><i class="fa-brands fa-youtube"></i></a><a href="${settings.socials.tiktok}" target="_blank" class="hover:text-black transition text-gray-500 mx-1"><i class="fa-brands fa-tiktok"></i></a>`;
    </script>
</body>
</html>
