<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yönetim Paneli | Fiber Tesisat</title>
  <style>
    body { font-family: sans-serif; background: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
    .giris-kutusu, .yonetim-masasi { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; max-width: 500px; width: 100%; }
    .yonetim-masasi { display: none; text-align: left; max-width: 600px; }
    h2 { color: #0f172a; margin-bottom: 20px; font-size: 24px; text-align: center; }
    input, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
    label { font-weight: bold; color: #334155; display: block; margin-bottom: 5px; font-size: 14px; }
    button { width: 100%; background: #14b8a6; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:hover { background: #0d9488; }
    .grup { margin-bottom: 15px; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px; }
  </style>
</head>
<body>

  <!-- ŞİFRE EKRANI -->
  <div class="giris-kutusu" id="giris-alani">
    <h2>Fiber Tesisat <br><span style="color:#14b8a6; font-size:16px;">Yönetim Paneli Girişi</span></h2>
    <input type="password" id="sifre-alani" placeholder="Yönetici Şifrenizi Girin" style="text-align:center;">
    <button onclick="sistemeGir()">Sisteme Giriş Yap 🚀</button>
  </div>

  <!-- GERÇEK DÜZENLEME FORMU -->
  <div class="yonetim-masasi" id="panel-alani">
    <h2>🛠️ Fiber Tesisat Canlı Yönetim Masası</h2>
    
    <div class="grup">
      <label>7/24 Telefon Numarası</label>
      <input type="text" id="p-tel" value="0531 231 69 02">
    </div>

    <div class="grup">
      <label>Ana Sayfa Büyük Başlık</label>
      <input type="text" id="p-baslik" value="Cihazlar ile Kırmadan Dökmeden Su Kaçağı Tespiti">
    </div>

    <div class="grup">
      <label>YouTube Video Alanı 1 (Video Linki)</label>
      <input type="text" id="p-yt1" value="https://youtube.com" placeholder="https://youtube.com...">
    </div>

    <div class="grup">
      <label>YouTube Video Alanı 2 (Video Linki)</label>
      <input type="text" id="p-yt2" value="https://youtube.com" placeholder="https://youtube.com...">
    </div>

    <button onclick="ayarlariCanliyaAl()">Değişiklikleri Sitede Güncelle 🚀</button>
  </div>

  <script>
    function sistemeGir() {
      var sifre = document.getElementById('sifre-alani').value;
      // Buraya kendi şifrenizi yazabilirsiniz, şu anlık "fiber44" olarak ayarlıdır
      if(sifre === "Fenerbahçe2140") {
        document.getElementById('giris-alani').style.display = 'none';
        document.getElementById('panel-alani').style.display = 'block';
      } else {
        alert("Hatalı Şifre! Giriş Reddedildi.");
      }
    }

    function ayarlariCanliyaAl() {
      // Formdaki verileri oku
      var tel = document.getElementById('p-tel').value;
      var baslik = document.getElementById('p-baslik').value;
      var yt1 = document.getElementById('p-yt1').value;
      var yt2 = document.getElementById('p-yt2').value;

      // Tarayıcı hafızasına kalıcı kaydet
      localStorage.setItem('site_tel', tel);
      localStorage.setItem('site_baslik', baslik);
      localStorage.setItem('site_yt1', yt1);
      localStorage.setItem('site_yt2', yt2);

      alert("Mükemmel! Değişiklikleriniz tarayıcı hafızasına başarıyla işlendi.");
    }
  </script>
</body>
</html>
