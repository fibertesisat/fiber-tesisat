<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makale Detay - Fiber Tesisat</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <meta name="keywords" id="seo-keywords" content="fiber tesisat, istanbul tesisatçı">
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen font-sans">

    <nav class="bg-white shadow-md sticky top-0 z-50 px-4 py-3 flex justify-between items-center">
        <a href="index.html" class="block"><img src="images/logo.png" style="height:45px; width:auto;" alt="Logo"></a>
        <a href="blog.html" class="text-sm font-bold text-sky-600 hover:underline">&larr; Listeye Dön</a>
    </nav>

    <main class="max-w-3xl mx-auto px-4 py-12 w-full flex-grow">
        <article class="bg-white p-6 md:p-10 rounded-2xl shadow-sm border border-gray-100">
            <span class="text-xs text-gray-400 font-bold block mb-2" id="box-date"></span>
            <h1 class="text-2xl md:text-4xl font-black text-gray-900 mb-6" id="box-title"></h1>
            <img src="" id="box-img" class="w-full h-80 object-cover rounded-xl mb-8 shadow-sm bg-gray-100" alt="Kapak">
            <div class="text-gray-700 leading-relaxed text-sm md:text-base space-y-4 whitespace-pre-line text-justify" id="box-content"></div>
        </article>
    </main>

    <script>
        const settings = JSON.parse(localStorage.getItem('fiberTesisatSettings')) || { blogs9: [] };
        const urlParams = new URLSearchParams(window.location.search);
        const boxId = parseInt(urlParams.get('boxId')) || 1;

        const default9Blogs = [];
        for(let i=1; i<=9; i++) {
            default9Blogs.push({ id: i, title: `Makale Başlığı #${i}`, summary:'', content: 'İçerik doldurulmadı.', img: 'https://unsplash.com', date: '24.09.2026', keywords: 'tesisat' });
        }
        
        const activeList = (settings.blogs9 && settings.blogs9.length === 9) ? settings.blogs9 : default9Blogs;
        const currentArticle = activeList.find(b => b.id === boxId) || default9Blogs[0];

        document.title = currentArticle.title + " - Fiber Tesisat";
        document.getElementById('box-title').innerText = currentArticle.title;
        document.getElementById('box-date').innerText = `Yayınlanma Tarihi: ${currentArticle.date}`;
        document.getElementById('box-img').src = currentArticle.img;
        document.getElementById('box-content').innerText = currentArticle.content;
        document.getElementById('seo-keywords').setAttribute('content', currentArticle.keywords || 'tesisat');
    </script>
</body>
</html>
