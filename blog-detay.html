<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makale Detay - Fiber Tesisat</title>
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Dinamik Google Meta Etiketleri Altyapısı (Keywords için) -->
    <meta name="keywords" id="seo-keywords" content="fiber tesisat, istanbul tesisatçı">
    <style>
        :root { --primary-color: #0284c7; --font-family: 'sans-serif'; }
        body { font-family: var(--font-family); }
        .bg-primary { background-color: var(--primary-color); }
        .text-primary { color: var(--primary-color); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black text-primary tracking-tight">FIBER TESİSAT</a>
            <a href="blog.html" class="text-sm font-bold text-gray-600 hover:text-primary">&larr; Tüm Listeye Dön</a>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 py-12 w-full flex-grow">
        <article class="bg-white p-6 md:p-10 rounded-2xl shadow-sm border border-gray-100">
            <span class="text-xs text-gray-400 font-bold block mb-2" id="box-date"></span>
            <h1 class="text-2xl md:text-4xl font-black text-gray-900 mb-6 leading-tight" id="box-title"></h1>
            <img src="" id="box-img" class="w-full h-80 object-cover rounded-xl mb-8 shadow-inner bg-gray-100" alt="Kapak">
            <div class="text-gray-700 leading-relaxed text-sm md:text-base space-y-4 whitespace-pre-line text-justify" id="box-content"></div>
        </article>
    </main>

    <script>
        const settings = JSON.parse(localStorage.getItem('fiberTesisatSettings')) || { blogs9: [] };
        const urlParams = new URLSearchParams(window.location.search);
        const boxId = parseInt(urlParams.get('boxId')) || 1;

        // Varsayılan fall-back array (Eğer içi boşsa)
        const default9Blogs = [];
        for(let i=1; i<=9; i++) {
            default9Blogs.push({ id: i, title: `Makale Başlığı #${i}`, summary:'', content: 'İçerik doldurulmadı.', img: 'https://unsplash.com', date: '24.09.2026', keywords: 'tesisat' });
        }
        
        const activeList = (settings.blogs9 && settings.blogs9.length === 9) ? settings.blogs9 : default9Blogs;
        const currentArticle = activeList.find(b => b.id === boxId) || default9Blogs[0];

        // Ekran elementlerini doldur
        document.title = currentArticle.title + " - Fiber Tesisat";
        document.getElementById('box-title').innerText = currentArticle.title;
        document.getElementById('box-date').innerHTML = `<i class="fa-solid fa-calendar-days text-primary"></i> Yayınlanma Tarihi: ${currentArticle.date}`;
        document.getElementById('box-img').src = currentArticle.img;
        document.getElementById('box-content').innerText = currentArticle.content;
        document.getElementById('seo-keywords').setAttribute('content', currentArticle.keywords || 'tesisat, istanbul');
    </script>
</body>
</html>
