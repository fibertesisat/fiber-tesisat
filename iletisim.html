<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim | Fiber Tesisat</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background-color: #f8fafc; color: #1e293b; }
        nav { background: #ffffff; padding: 15px 40px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .logo-ana { font-size: 24px; font-weight: 800; color: #1e3a8a; }
        .menu { display: flex; gap: 30px; }
        .menu a { text-decoration: none; color: #475569; font-weight: 600; font-size: 15px; }
        .menu a.aktif { color: #1e3a8a; border-bottom: 2px solid #1e3a8a; padding-bottom: 4px; }
        .iletisim-kutu { max-width: 1000px; margin: 60px auto; background: white; border-radius: 24px; border: 1px solid #e2e8f0; padding: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .il-btn { background: #14b8a6; color: white; text-decoration: none; padding: 15px; border-radius: 12px; font-weight: bold; font-size: 18px; display: block; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <nav>
        <span class="logo-ana">FİBER TESİSAT</span>
        <div class="menu">
            <a href="index.html">Ana Sayfa</a>
            <a href="referanslar.html">Referanslar</a>
            <a href="iletisim.html" class="aktif">İletişim</a>
        </div>
    </nav>
    <main class="iletisim-kutu">
        <div>
            <h1 style="font-size:32px; font-weight:800;">Bizimle İletişime Geçin</h1>
            <p style="color:#64748b; margin-top:10px;">İstanbul genelinde mobil ekiplerimizle en kısa sürede adresinizdeyiz.</p>
            <div style="margin-top:30px;">
                <h4 style="font-weight:bold;">Merkez Ofis Adresi</h4>
                <p id="il-adres" style="color:#64748b; margin-top:5px;">Çınar Mahallesi 820. Sk. No:44/B Bağcılar / İstanbul</p>
            </div>
        </div>
        <div style="background:#f8fafc; border-radius:20px; padding:30px; border:1px solid #e2e8f0; display:flex; flex-direction:column; justify-content:center;">
            <h3 style="font-size:22px; text-align:center; margin-bottom:15px;">Acil Tesisatçı Çağır</h3>
            <a href="tel:+905312316902" id="il-btn" class="il-btn">Hemen Ustayı Ara 📞</a>
        </div>
    </main>
    <script>
        window.onload = function() {
            if(localStorage.getItem('site_tel')) document.getElementById('il-btn').href = "tel:" + localStorage.getItem('site_tel');
            if(localStorage.getItem('site_adres')) document.getElementById('il-adres').innerText = localStorage.getItem('site_adres');
        }
    </script>
</body>
</html>
